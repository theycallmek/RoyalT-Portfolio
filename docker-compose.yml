services:
  stats:
    build: { context: ., dockerfile: Dockerfile.stats }
    environment:
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_CHANNEL_ID: ${YOUTUBE_CHANNEL_ID:-}
      GITHUB_USER: ${GITHUB_USER:-theycallmek}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      HOMELAB_NODES: ${HOMELAB_NODES:-}
    # Homelab agents POST /ingest here (never proxied by Caddy). On the server INGEST_BIND is its
    # Tailscale IPv4, so only tailnet peers can reach it.
    ports: ["${INGEST_BIND:-127.0.0.1}:8788:8788"]
    volumes: [stats-data:/data]
    restart: unless-stopped
  web:
    build:
      context: .
      args: { SITE_URL: "${SITE_URL:-http://localhost:8085}" }
    # Localhost only: Tailscale Funnel (backup address) publishes it; the Cloudflare tunnel reaches
    # it over the compose network as http://web:80.
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    depends_on: [stats, goatcounter]
    restart: unless-stopped
  # Private analytics. Caddy proxies only /count and /count.js to it; the dashboard is published on
  # INGEST_BIND (the Tailscale IP), so only tailnet devices can open it: http://<tailscale-ip>:8790
  goatcounter:
    image: arp242/goatcounter:2.7.0
    ports: ["${INGEST_BIND:-127.0.0.1}:8790:8080"]
    volumes: [goatcounter-data:/home/goatcounter/goatcounter-data]
    restart: unless-stopped
  # Nicer GoatCounter dashboard (analytics-dashboard/), tailnet only: http://<tailscale-ip>:8791
  analytics-dashboard:
    build: analytics-dashboard
    ports: ["${INGEST_BIND:-127.0.0.1}:8791:80"]
    depends_on: [goatcounter]
    restart: unless-stopped
  # Cloudflare Tunnel for the public domain: outbound-only connection, no published ports.
  # Enabled with COMPOSE_PROFILES=tunnel and CLOUDFLARE_TUNNEL_TOKEN in .env (docs/DEPLOY.md).
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [web]
    restart: unless-stopped
    profiles: [tunnel]
volumes:
  stats-data:
  goatcounter-data:
